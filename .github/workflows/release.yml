name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set package version
        working-directory: klyro-dashboard
        run: npm version ${{ steps.version.outputs.tag }} --no-git-tag-version

      - name: Install frontend dependencies
        working-directory: klyro-dashboard
        run: npm install

      - name: Build Angular dashboard
        working-directory: klyro-dashboard
        run: npx ng build --configuration=production

      - name: Package schemas
        run: |
          mkdir -p dist/schemas
          cp docs/schema/config.schema.json dist/schemas/
          cp docs/schema/zone.schema.json dist/schemas/

      - name: Create source zip
        run: |
          git archive --format=zip --output=dist/klyro-${{ steps.version.outputs.tag }}.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/schemas/config.schema.json
            dist/schemas/zone.schema.json
            dist/klyro-${{ steps.version.outputs.tag }}.zip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
