name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: klyro-dashboard/package-lock.json

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: klyro-dashboard
        run: npm install

      - name: Build Angular dashboard
        working-directory: klyro-dashboard
        run: npx ng build --configuration=production

      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/klyrodns-linux-amd64 ./cmd/klyrodns

      - name: Build Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/klyrodns-linux-arm64 ./cmd/klyrodns

      - name: Build macOS amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/klyrodns-darwin-amd64 ./cmd/klyrodns

      - name: Build macOS arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/klyrodns-darwin-arm64 ./cmd/klyrodns

      - name: Build Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/klyrodns-windows-amd64.exe ./cmd/klyrodns

      - name: Package schemas
        run: |
          mkdir -p dist/schemas
          cp docs/schema/config.schema.json dist/schemas/
          cp docs/schema/zone.schema.json dist/schemas/
          cd dist/schemas && tar czf ../schemas.tar.gz *.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/klyrodns-linux-amd64
            dist/klyrodns-linux-arm64
            dist/klyrodns-darwin-amd64
            dist/klyrodns-darwin-arm64
            dist/klyrodns-windows-amd64.exe
            dist/schemas/config.schema.json
            dist/schemas/zone.schema.json
            dist/schemas.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: klyrodns/klyrodns
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
